<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winterholme Wellness Center & Spa — St. John's</title>
  <meta name="description" content="Winterholme Wellness Center & Spa in St. John's, NL offers premium massage therapy, spa treatments, and holistic wellness services. Book your restorative session today and experience expert care in the heart of St. John's.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel='stylesheet' href='https://gauravdeep2226-ai.github.io/audits/css/base.css'>
  <link rel='stylesheet' href='https://gauravdeep2226-ai.github.io/audits/css/massage.css'>
  <style>
    :root {
      --brand-primary: #6d8b74;
      --brand-primary-light: #8aab93;
      --brand-primary-dark: #4a6741;
      --brand-primary-rgb: 109,139,116;
      --brand-secondary: #1a2e1a;
      --brand-accent: #d4a574;
      --brand-surface-alt: #f6faf3;
      --brand-text: #1a2e1a;
      --brand-text-muted: #5a7260;
      --brand-border: #d8e4da;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--brand-text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ─── NAV ─────────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 20px 0;
      transition: all 0.4s ease;
      background: transparent;
    }

    .nav.scrolled {
      background: #fff;
      box-shadow: 0 2px 30px rgba(0,0,0,0.1);
      padding: 12px 0;
    }

    .nav__container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav__logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      transition: color 0.4s ease;
      line-height: 1.2;
    }

    .nav__logo span {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .nav.scrolled .nav__logo {
      color: var(--brand-secondary);
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav__links a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.4s ease;
      letter-spacing: 0.3px;
    }

    .nav__links a:hover {
      color: var(--brand-accent);
    }

    .nav.scrolled .nav__links a {
      color: var(--brand-text-muted);
    }

    .nav.scrolled .nav__links a:hover {
      color: var(--brand-primary);
    }

    .nav__phone {
      color: rgba(255,255,255,0.9) !important;
      font-weight: 600 !important;
      transition: color 0.4s ease !important;
    }

    .nav.scrolled .nav__phone {
      color: var(--brand-primary) !important;
    }

    .nav__actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .btn--primary {
      background: var(--brand-primary);
      color: #fff;
    }

    .btn--primary:hover {
      background: var(--brand-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(var(--brand-primary-rgb), 0.4);
    }

    .btn--outline {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.8);
    }

    .btn--outline:hover {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
    }

    .btn--dark {
      background: var(--brand-secondary);
      color: #fff;
    }

    .btn--dark:hover {
      background: #0d1a0d;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn--lg {
      padding: 16px 40px;
      font-size: 1rem;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #fff;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .nav.scrolled .hamburger span {
      background: var(--brand-secondary);
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ─── MOBILE NAV ────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .hamburger { display: flex; }

      .nav__links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 280px;
        height: 100vh;
        background: var(--brand-secondary);
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 32px;
        gap: 24px;
        transition: right 0.4s ease;
        z-index: 999;
      }

      .nav__links.open {
        right: 0;
      }

      .nav__links a {
        font-size: 1.1rem;
        color: rgba(255,255,255,0.9) !important;
      }

      .nav__phone {
        color: var(--brand-accent) !important;
      }

      .nav__actions .btn { display: none; }
    }

    /* ─── HERO ──────────────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background-image: url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(26,46,26,0.82) 0%,
        rgba(26,46,26,0.55) 60%,
        rgba(109,139,116,0.35) 100%
      );
    }

    .hero__content {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 120px 24px 80px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .hero__badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .hero__badge .star {
      color: #f5c842;
    }

    .display-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .display-heading em {
      font-style: italic;
      color: var(--brand-accent);
    }

    .hero__sub {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255,255,255,0.88);
      max-width: 560px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .hero__ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    /* ─── STATS BAR ─────────────────────────────────────────────── */
    .stats-bar {
      background: var(--brand-secondary);
      padding: 36px 24px;
      position: relative;
      margin-top: -4px;
    }

    .stats-bar__inner {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      text-align: center;
    }

    .stat-item {
      padding: 12px;
    }

    .stat-item__number {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--brand-accent);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-item__label {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .stats-bar__inner {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ─── SECTION BASE ──────────────────────────────────────────── */
    .section {
      padding: 90px 24px;
      background: #fff;
    }

    .section--alt {
      background: var(--brand-surface-alt);
    }

    .section__inner {
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-label {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--brand-primary);
      margin-bottom: 14px;
    }

    .section__heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 800;
      color: var(--brand-secondary);
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .section__sub {
      font-size: 1.05rem;
      color: var(--brand-text-muted);
      max-width: 580px;
      line-height: 1.7;
    }

    .section__header {
      text-align: center;
      margin-bottom: 52px;
    }

    .section__header .section__sub {
      margin: 0 auto;
    }

    /* ─── SPECIALTIES ───────────────────────────────────────────── */
    .modality-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .modality-tag {
      padding: 10px 22px;
      background: #fff;
      border: 2px solid var(--brand-border);
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--brand-text);
      cursor: default;
      transition: all 0.3s ease;
    }

    .modality-tag:hover {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #fff;
      transform: translateY(-2px);
    }

    .section--alt .modality-tag {
      background: #fff;
    }

    /* ─── SERVICES GRID ─────────────────────────────────────────── */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    @media (max-width: 900px) {
      .services-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .services-grid { grid-template-columns: 1fr; }
    }

    .service-card {
      background: #fff;
      border-radius: 18px;
      padding: 36px 30px;
      border: 1px solid var(--brand-border);
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-accent));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(var(--brand-primary-rgb), 0.15);
      border-color: var(--brand-primary-light);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-card__icon {
      font-size: 2.2rem;
      margin-bottom: 18px;
      display: block;
    }

    .service-card__title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand-secondary);
      margin-bottom: 10px;
    }

    .service-card__desc {
      font-size: 0.92rem;
      color: var(--brand-text-muted);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .service-card__price {
      display: inline-block;
      background: var(--brand-surface-alt);
      color: var(--brand-primary-dark);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid var(--brand-border);
    }

    /* ─── ABOUT ─────────────────────────────────────────────────── */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    @media (max-width: 860px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    .about-grid__image {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
    }

    .about-grid__image img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      display: block;
      border-radius: 20px;
    }

    .about-grid__image::after {
      content: '';
      position: absolute;
      bottom: -20px;
      right: -20px;
      width: 160px;
      height: 160px;
      background: var(--brand-accent);
      border-radius: 50%;
      opacity: 0.2;
      z-index: -1;
    }

    .check-list {
      list-style: none;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.95rem;
      color: var(--brand-text);
    }

    .check-list li::before {
      content: '✓';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      min-width: 22px;
      background: var(--brand-primary);
      color: #fff;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* ─── TESTIMONIALS ──────────────────────────────────────────── */
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    @media (max-width: 900px) {
      .testimonials-grid { grid-template-columns: 1fr; }
    }

    .testimonial-card {
      background: #fff;
      border-radius: 18px;
      padding: 36px 30px;
      border: 1px solid var(--brand-border);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .testimonial-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(var(--brand-primary-rgb), 0.12);
    }

    .testimonial-card__stars {
      color: #f5c842;
      font-size: 1rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .testimonial-card__text {
      font-size: 0.95rem;
      color: var(--brand-text-muted);
      line-height: 1.7;
      margin-bottom: 24px;
      font-style: italic;
    }

    .testimonial-card__author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .testimonial-card__avatar {
      width: 44px;
      height: 44px;
      background: var(--brand-primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .testimonial-card__name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--brand-secondary);
    }

    .testimonial-card__source {
      font-size: 0.8rem;
      color: var(--brand-text-muted);
    }

    /* ─── CTA SECTION ───────────────────────────────────────────── */
    .cta-section {
      background: linear-gradient(135deg, var(--brand-primary-dark) 0%, var(--brand-primary) 50%, var(--brand-primary-light) 100%);
      padding: 90px 24px;
      text-align: center;
    }

    .cta-section__heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .cta-section__sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.85);
      max-width: 520px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    /* ─── CONTACT ───────────────────────────────────────────────── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    .contact-info__item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
    }

    .contact-info__icon {
      width: 44px;
      height: 44px;
      background: var(--brand-surface-alt);
      border: 1px solid var(--brand-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .contact-info__label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--brand-text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .contact-info__value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--brand-secondary);
    }

    .contact-info__value a {
      color: var(--brand-primary);
      text-decoration: none;
    }

    .contact-info__value a:hover {
      text-decoration: underline;
    }

    .hours-grid {
      margin-top: 16px;
      border: 1px solid var(--brand-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .hours-grid__row {
      display: flex;
      justify-content: space-between;
      padding: 10px 18px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--brand-border);
    }

    .hours-grid__row:last-child {
      border-bottom: none;
    }

    .hours-grid__row:nth-child(even) {
      background: var(--brand-surface-alt);
    }

    .hours-grid__day {
      font-weight: 600;
      color: var(--brand-secondary);
    }

    .hours-grid__time {
      color: var(--brand-text-muted);
    }

    .hours-grid__heading {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--brand-primary);
      padding: 12px 18px 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--brand-surface-alt);
      border-bottom: 1px solid var(--brand-border);
    }

    .map-embed {
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      height: 420px;
    }

    .map-embed iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ─── FOOTER ────────────────────────────────────────────────── */
    .footer {
      background: var(--brand-secondary);
      color: rgba(255,255,255,0.75);
      padding: 64px 24px 32px;
    }

    .footer__grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 32px;
    }

    @media (max-width: 860px) {
      .footer__grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 560px) {
      .footer__grid { grid-template-columns: 1fr; }
    }

    .footer__brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
    }

    .footer__brand-desc {
      font-size: 0.92rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
    }

    .footer__heading {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--brand-accent);
      margin-bottom: 18px;
    }

    .footer__links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer__links a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.92rem;
      transition: color 0.3s;
    }

    .footer__links a:hover {
      color: var(--brand-accent);
    }

    .footer__contact-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.92rem;
    }

    .footer__contact-icon {
      font-size: 1rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .footer__contact-item a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer__contact-item a:hover {
      color: var(--brand-accent);
    }

    .footer__bottom {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer__copy {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
    }
